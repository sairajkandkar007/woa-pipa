name: Pipa Kernel Source Inventory

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Fetch complete kernel tree index
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, urllib.request
          url = "https://api.github.com/repos/sairajkandkar007/Xiaomi_Kernel_OpenSource/git/trees/pipa-t-oss?recursive=1"
          req = urllib.request.Request(url, headers={"Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28","User-Agent":"woa-pipa-source-audit"})
          with urllib.request.urlopen(req, timeout=90) as response:
              data = json.load(response)
          with open("kernel-tree.json", "w", encoding="utf-8") as f:
              json.dump(data, f)
          print("Tree SHA:", data.get("sha"))
          print("Truncated:", data.get("truncated"))
          print("Paths returned:", len(data.get("tree", [])))
          if data.get("truncated"):
              raise SystemExit("GitHub returned a truncated tree; inventory cannot be treated as complete.")
          PY

      - name: Analyze configuration, device-tree, and build paths
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.load(open("kernel-tree.json", encoding="utf-8"))
          entries = data.get("tree", [])
          paths = [x["path"] for x in entries if x.get("type") == "blob"]
          groups = {
              "Pipa-named paths": lambda p: "pipa" in p.lower(),
              "ARM64 kernel defconfigs": lambda p: p.startswith("arch/arm64/configs/") and "defconfig" in p.lower(),
              "Device-tree source/build files": lambda p: p.startswith("arch/arm64/boot/dts/") and p.endswith((".dts", ".dtsi", "Makefile", "Kbuild")),
              "Build files potentially relevant to config selection": lambda p: p.endswith((".mk", ".mak", ".bp")) or p.rsplit("/",1)[-1] in ("Kbuild","Makefile","build.config","build.config.gki"),
              "DTB/DTBO-related paths": lambda p: any(k in p.lower() for k in ("dtbo", "dtb.img", "dtbtool", "dtb"))
          }
          lines = ["# Pipa Kernel Source Inventory", "", "Generated from the recursive Git Trees API for the pipa-t-oss ref.", "", "- Tree SHA: " + str(data.get("sha")), "- Truncated: " + str(data.get("truncated")), "- Total entries: " + str(len(entries)), "- Blob paths: " + str(len(paths)), "", "This is a path inventory, not proof that a file is selected by the Android product build."]
          for title, predicate in groups.items():
              matches = sorted(p for p in paths if predicate(p))
              lines += ["", "## " + title, "", "Count: " + str(len(matches)), ""]
              lines += ["- " + p for p in matches[:2000]]
              if len(matches) > 2000:
                  lines += ["- Additional paths omitted from this section: " + str(len(matches)-2000)]
          Path("pipa-source-inventory.md").write_text("\n".join(lines) + "\n", encoding="utf-8")
          print("Inventory created; total paths:", len(paths))
          PY

      - name: Upload audit outputs
        uses: actions/upload-artifact@v4
        with:
          name: pipa-kernel-source-inventory
          path: |
            pipa-source-inventory.md
            kernel-tree.json
          if-no-files-found: error
          retention-days: 14
