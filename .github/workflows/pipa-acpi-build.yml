name: Pipa ACPI table validation

on:
  push:
    paths:
      - "acpi/pipa/**"
      - ".github/workflows/pipa-acpi-build.yml"
  pull_request:
    paths:
      - "acpi/pipa/**"
      - ".github/workflows/pipa-acpi-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-acpi:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Checkout pipa project
        uses: actions/checkout@v4

      - name: Install ACPICA tools
        run: |
          sudo apt-get update
          sudo apt-get install -y acpica-tools
          iasl -v

      - name: Fetch verified SM8250 reference tables
        run: |
          set -euxo pipefail
          git clone --depth=1 https://github.com/sairajkandkar007/Mu-Qcom.git mu-qcom
          test -s mu-qcom/Silicon/Qualcomm/SM8250Pkg/AcpiTables/APIC.aml
          test -s mu-qcom/Silicon/Qualcomm/SM8250Pkg/AcpiTables/FACP.aml
          test -s mu-qcom/Silicon/Qualcomm/SM8250Pkg/AcpiTables/GTDT.aml

      - name: Compile pipa DSDT scaffold
        run: |
          set -euxo pipefail
          mkdir -p out/acpi
          iasl -tc -p out/acpi/DSDT acpi/pipa/DSDT.asl
          test -s out/acpi/DSDT.aml
          # The DSDT source intentionally hides UFS until its resources/dependencies
          # and Windows driver contract have been validated.
          grep -q 'Return (Zero)' acpi/pipa/DSDT.asl
          if grep -Eq 'Name[[:space:]]*\\(_CRS|Method[[:space:]]*\\(_CRS' acpi/pipa/DSDT.asl; then
            echo "Disabled UFS scaffold must not expose _CRS."
            exit 1
          fi

      - name: Validate signatures and decompile all four tables
        run: |
          set -euxo pipefail
          cp mu-qcom/Silicon/Qualcomm/SM8250Pkg/AcpiTables/APIC.aml out/acpi/APIC.aml
          cp mu-qcom/Silicon/Qualcomm/SM8250Pkg/AcpiTables/FACP.aml out/acpi/FACP.aml
          cp mu-qcom/Silicon/Qualcomm/SM8250Pkg/AcpiTables/GTDT.aml out/acpi/GTDT.aml
          for table in APIC FACP GTDT DSDT; do
            test -s "out/acpi/$table.aml"
            iasl -d "out/acpi/$table.aml"
            test -s "out/acpi/$table.dsl"
            grep -q "Signature.*\\"$table\\"\|DefinitionBlock" "out/acpi/$table.dsl" || {
              echo "Unable to identify expected ACPI table $table"
              exit 1
            }
          done
          # Record exact source revision so the upstream binary tables are traceable.
          git -C mu-qcom rev-parse HEAD > out/acpi/MU_QCOM_COMMIT.txt
          {
            echo "# Pipa ACPI table validation"
            echo
            echo "- DSDT: compiled from `acpi/pipa/DSDT.asl` in this repository."
            echo "- APIC/FACP/GTDT: reused from the SM8250 table binaries in Mu-Qcom."
            echo "- Mu-Qcom commit: `$(cat out/acpi/MU_QCOM_COMMIT.txt)`"
            echo "- Validation: each AML was present and decompiled by ACPICA."
            echo "- Scope: table-set validation only; this is not a full UEFI build or hardware validation."
            echo "- UFS remains disabled in the DSDT scaffold."
            echo
            iasl -v
          } > out/acpi/VALIDATION_REPORT.md

      - name: Upload validated ACPI tables and report
        uses: actions/upload-artifact@v4
        with:
          name: pipa-acpi-table-set
          path: out/acpi/
          if-no-files-found: error
          retention-days: 14
