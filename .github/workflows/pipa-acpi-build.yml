name: Pipa ACPI table validation

on:
  push:
    paths:
      - "acpi/pipa/**"
      - ".github/workflows/pipa-acpi-build.yml"
  pull_request:
    paths:
      - "acpi/pipa/**"
      - ".github/workflows/pipa-acpi-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-acpi:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Checkout pipa project
        uses: actions/checkout@v4

      - name: Install ACPICA tools
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y acpica-tools
          iasl -v

      - name: Fetch SM8250 reference AML tables
        run: |
          set -euxo pipefail
          git clone --depth=1 https://github.com/sairajkandkar007/Mu-Qcom.git mu-qcom
          test -s mu-qcom/Silicon/Qualcomm/SM8250Pkg/AcpiTables/APIC.aml
          test -s mu-qcom/Silicon/Qualcomm/SM8250Pkg/AcpiTables/FACP.aml
          test -s mu-qcom/Silicon/Qualcomm/SM8250Pkg/AcpiTables/GTDT.aml

      - name: Compile and inspect pipa DSDT
        run: |
          set -euxo pipefail
          mkdir -p out/acpi
          iasl -tc -p out/acpi/DSDT acpi/pipa/DSDT.asl
          test -s out/acpi/DSDT.aml
          iasl -d out/acpi/DSDT.aml
          test -s out/acpi/DSDT.dsl
          grep -q 'Return (0x0F)' acpi/pipa/DSDT.asl
          grep -q '0x01D84000' acpi/pipa/DSDT.asl
          grep -q '0x00003000' acpi/pipa/DSDT.asl
          grep -q '0x01D90000' acpi/pipa/DSDT.asl
          grep -q '0x00008000' acpi/pipa/DSDT.asl
          grep -q '0x00000129' acpi/pipa/DSDT.asl

      - name: Validate all four table signatures by decompilation
        run: |
          set -euxo pipefail
          cp mu-qcom/Silicon/Qualcomm/SM8250Pkg/AcpiTables/APIC.aml out/acpi/APIC.aml
          cp mu-qcom/Silicon/Qualcomm/SM8250Pkg/AcpiTables/FACP.aml out/acpi/FACP.aml
          cp mu-qcom/Silicon/Qualcomm/SM8250Pkg/AcpiTables/GTDT.aml out/acpi/GTDT.aml
          for table in APIC FACP GTDT DSDT; do
            test -s "out/acpi/$table.aml"
            iasl -d "out/acpi/$table.aml"
            test -s "out/acpi/$table.dsl"
          done
          git -C mu-qcom rev-parse HEAD > out/acpi/MU_QCOM_COMMIT.txt
          {
            echo "# Pipa ACPI validation report"
            echo
            echo "- DSDT is compiled from the project's pipa-specific ASL."
            echo "- APIC/FACP/GTDT are reference AML tables from Mu-Qcom."
            echo "- Mu-Qcom commit: $(cat out/acpi/MU_QCOM_COMMIT.txt)"
            echo "- UFS is exposed with the audited controller and ICE MMIO windows."
            echo "- GSI mapping, Windows driver compatibility, and clock/reset/PHY sequencing remain unverified."
            echo "- Passing IASL checks validate syntax and AML parsing only, not hardware functionality."
            echo
            iasl -v
          } > out/acpi/VALIDATION_REPORT.md

      - name: Upload validated ACPI tables and report
        uses: actions/upload-artifact@v4
        with:
          name: pipa-acpi-table-set
          path: out/acpi/
          if-no-files-found: error
          retention-days: 14
